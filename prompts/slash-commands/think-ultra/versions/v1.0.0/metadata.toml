[command]
id = "think-ultra"
type = "slash-command"
name = "think-ultra"
title = "Maximum Thinking Mode"
description = "Trigger maximum thinking mode for the most complex problems"
version = "v1.0.0"
created = "2025-07-14T00:00:00Z"
updated = "2025-07-14T00:00:00Z"

[author]
name = "markshawn2020"

[usage]
arguments = ["problem-or-question"]
